[build-system]
requires = ['setuptools>=77.0', 'wheel']
build-backend = 'setuptools.build_meta'

[project]
name = 'd2p-core-py'
version = '0.1.1'
description = 'Python wrapper for the D2P.Core .NET library by Design-to-Production, for Rhino 8 / Grasshopper'
readme = 'README.md'
license = 'MIT'
license-files = ['LICENSE']
requires-python = '>=3.9'
authors = [
    {name = 'Max Benjamin Eschenbach', email = 'max.eschenbach@tu-darmstadt.de'},
    {name = 'Design-to-Production GmbH'},
]
maintainers = [
    {name = 'Max Benjamin Eschenbach', email = 'max.eschenbach@tu-darmstadt.de'},
    {name = 'Design-to-Production GmbH'},
]
keywords = [
    'rhino',
    'rhino3d',
    'grasshopper',
    'rhinocommon',
    'cad',
    'parametric-design',
    'fabrication',
    'd2p',
]
classifiers = [
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Intended Audience :: Manufacturing',
    'Intended Audience :: Science/Research',
    'Operating System :: Microsoft :: Windows',
    'Operating System :: MacOS',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.9',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Topic :: Multimedia :: Graphics :: 3D Modeling',
    'Topic :: Scientific/Engineering',
]

# pythonnet is deliberately absent: inside Rhino 8 the CLR is already
# provided by the host, and outside Rhino it arrives transitively via
# rhinoinside. Declaring it here would install a second copy into Rhino's
# Python environment.
dependencies = []

[project.optional-dependencies]
standalone = [
    'rhinoinside',
]
dev = [
    'rhinoinside',
    'pytest',
    'flake8',
    'build',
    'twine',
]

[project.urls]
Homepage = 'https://github.com/design-to-production/D2P-Components'
Repository = 'https://github.com/design-to-production/D2P-Components'
Issues = 'https://github.com/design-to-production/D2P-Components/issues'

[tool.setuptools.packages.find]
where = ['src']

[tool.setuptools.package-data]
d2p_core = ['lib/*.dll', 'py.typed']

[tool.setuptools]
zip-safe = false

[tool.pytest.ini_options]
testpaths = ['tests']
addopts = '-ra -q'
