[build-system]
requires = ['setuptools>=61.0', 'wheel']
build-backend = 'setuptools.build_meta'

[project]
name = 'd2p_core'
version = '1.0.2'
description = 'Python wrapper for D2P.Core .NET library by Design-to-production, designed for Rhino 8 / Grasshopper'
readme = 'README.md'
license = {text = 'MIT'}
requires-python = '>=3.9'
authors = [
    {name = 'Max Benjamin Eschenbach'},
]
classifiers = [
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.9',
    'Topic :: Scientific/Engineering',
]

[project.optional-dependencies]
standalone = [
    'rhinoinside',
]
dev = [
    'rhinoinside',
    'pytest',
    'flake8',
]

[project.urls]
Repository = 'https://github.com/design-to-production/D2P-Components'

[tool.setuptools.packages.find]
where = ['src']

[tool.setuptools.package-data]
d2p_core = ['lib/*.dll']

[tool.setuptools]
zip-safe = false

[tool.pytest.ini_options]
testpaths = ['tests']
addopts = '-ra -q'
